# GitHub is the canonical source; CircleCI provides independent public-code
# verification without GitHub Actions minutes or GCP credentials.
# Live dbt/BigQuery validation remains gated by an explicit opt-in on GitHub.
version: 2.1

# No CircleCI jobs are scheduled on ordinary pushes. Finish development,
# run the local source/Power BI checks, then explicitly request the final CI gate.
# An API/web-app trigger must set run_final_ci: true to enable this workflow.
parameters:
  # Cheap source/Power BI preflight: manual opt-in, no ML dependencies or GCP.
  run_quick_ci:
    type: boolean
    default: false
  run_final_ci:
    type: boolean
    default: false

jobs:
  dbt-source-preflight:
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install offline YAML/Jinja validators
          command: python -m pip install --disable-pip-version-check PyYAML==6.0.3 Jinja2==3.1.6
      - run:
          name: Syntax check Python scripts
          command: python -m compileall -q scripts
      - run:
          name: Check dbt YAML and model Jinja sources
          command: python scripts/check_offline_ci.py
      - run:
          name: Validate declared dbt documentation (offline)
          command: python scripts/check_declared_documentation.py
      - run:
          name: Validate documentation links and repository hygiene
          command: |
            python scripts/check_docs_integrity.py
            python -m unittest discover -s tests -p 'test_docs_integrity.py' -v
            python -m unittest discover -s tests -p 'test_repository_structure.py' -v
            python -m unittest discover -s tests -p 'test_dbt_declared_documentation.py' -v
      - run:
          name: Validate real PBIR page registry and native chart design
          command: |
            python -m unittest discover -s tests -p 'test_powerbi_audit.py' -v
            python -m unittest discover -s tests -p 'test_powerbi_chart_design.py' -v
            python scripts/audit_powerbi_visuals.py --mode both
      - run:
          name: Verify production PBIR and deterministic offline Power BI fixtures
          command: |
            python scripts/check_powerbi_project.py
            python scripts/check_powerbi_offline_demo.py

  ml-contract-smoke:
    docker:
      - image: cimg/python:3.11
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - football-ml-pip-v1-{{ checksum "requirements-ml.txt" }}
      - run:
          name: Install ML test dependencies (no BigQuery authentication)
          command: python -m pip install --disable-pip-version-check -r requirements-ml.txt
          no_output_timeout: 20m
      - save_cache:
          key: football-ml-pip-v1-{{ checksum "requirements-ml.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Run deterministic synthetic ML pipeline and quality gates
          command: python scripts/check_ml_pipeline.py
          no_output_timeout: 20m

  pbir-project-probe:
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify editable production PBIR project only
          command: python scripts/check_powerbi_project.py

  pbir-demo-probe:
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify synthetic offline PBIR fixtures only
          command: python scripts/check_powerbi_offline_demo.py

  transfer-fixture-probe:
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate deterministic 365-day transfer arithmetic in isolation
          command: python scripts/probe_powerbi_fixtures.py transfer

  relationship-fixture-probe:
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate offline relationship keys and model fixture values
          command: python scripts/probe_powerbi_fixtures.py relationships

  fixture-joins-probe:
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: Check joins in synthetic Power BI fixture
          command: python scripts/probe_powerbi_fixtures.py joins

  fixture-keys-probe:
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: Check keys in synthetic Power BI fixture
          command: python scripts/probe_powerbi_fixtures.py keys

  fixture-rates-probe:
    docker:
      - image: cimg/python:3.11
    resource_class: small
    steps:
      - checkout
      - run:
          name: Check rates in synthetic Power BI fixture
          command: python scripts/probe_powerbi_fixtures.py rates

workflows:
  verify-offline-lightweight:
    when: << pipeline.parameters.run_quick_ci >>
    jobs:
      - dbt-source-preflight

  verify-offline-source:
    when: << pipeline.parameters.run_final_ci >>
    jobs:
      - dbt-source-preflight
      - ml-contract-smoke
      - pbir-project-probe
      - pbir-demo-probe
      - transfer-fixture-probe
      - relationship-fixture-probe
      - fixture-joins-probe
      - fixture-keys-probe
      - fixture-rates-probe
